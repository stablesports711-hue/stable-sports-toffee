name: Build Final M3U8

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: |
          pip install requests

      - name: Create final M3U8
        run: |
          python merge.py

      - name: Commit final M3U8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final.m3u8
          git diff --cached --quiet || git commit -m "Update final.m3u8"
          git push
