name: Update SAFF Live 1 Playlist

on:
  schedule:
    # প্রতিদিন প্রতি ৬ ঘণ্টা পর পর রান হবে (প্রয়োজনমতো সময় পরিবর্তন করতে পারেন)
    - cron: '0 */6 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script to extract channel
        run: python update_playlist.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add saff_live_1.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SAFF Live 1 playlist [skip ci]" && git push)
